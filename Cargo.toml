[package]
name = "deepgram"
version = "0.10.0"
authors = ["Deepgram <developers@deepgram.com>"]
edition = "2021"
description = "Community Rust SDK for Deepgram's automated speech recognition APIs."
license = "MIT"
repository = "https://github.com/deepgram/deepgram-rust-sdk"
keywords = [
  "transcription",
  "voice-ai",
  "text-to-speech",
  "speech-to-text",
  "asr",
]
categories = ["api-bindings", "multimedia::audio", "network-programming"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# TODO Investigate which of these dependencies can go behind features.
bytes = "1"
futures = "^0.3"
http = "1.4"
pin-project = "1"
reqwest = { version = "^0.13", default-features = false, features = [
  "json",
  "rustls",
  "stream",
  "query",
] }
serde = { version = "^1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_urlencoded = "0.7.1"
thiserror = "2"
tokio = { version = "^1.45.1", features = ["full"] }
tokio-stream = "^0.1.17"
tokio-tungstenite = { version = "^0.28.0", features = [
  "rustls-tls-webpki-roots",
], optional = true }
tokio-util = { version = "^0.7", features = ["codec", "io"] }
tungstenite = { version = "^0.28.0", optional = true }
# TLS crates for the connect-diagnostics phase-timed connect path. Versions
# must stay in lockstep with what tokio-tungstenite's rustls-tls-webpki-roots
# feature resolves to, so both connect paths compile against the same crates.
rustls = { version = "^0.23", optional = true }
rustls-pki-types = { version = "^1", optional = true }
tokio-rustls = { version = "^0.26", optional = true }
webpki-roots = { version = "^0.26", optional = true }
url = "2"
uuid = { version = "1", features = ["serde"] }
# Dependencies below are specified only to satisfy minimal-versions.
sha256 = "^1.6.0"
anyhow = "^1.0.98"
tracing = ">=0.1.41"

[dev-dependencies]
# For the connect-diagnostics local mock-server tests; same version as the
# main dependency, so it adds no weight to the dev graph.
tokio-tungstenite = "^0.28.0"
cpal = "^0.16"
crossbeam = "0.8"
audio = "0.2.0"
rodio = { version = "0.20.1" }
pkg-config = { version = "0.3.30" }

[package.metadata.docs.rs]
all-features = true

[features]
default = ["manage", "listen", "speak"]
manage = []
listen = ["dep:tungstenite", "dep:tokio-tungstenite"]
speak = []
connect-diagnostics = [
  "listen",
  "dep:rustls",
  "dep:rustls-pki-types",
  "dep:tokio-rustls",
  "dep:webpki-roots",
  "uuid/v4",
]

[[example]]
name = "grant_token"
path = "examples/auth/grant_token.rs"

[[example]]
name = "prerecorded_from_file"
path = "examples/transcription/rest/prerecorded_from_file.rs"
required-features = ["listen"]

[[example]]
name = "callback"
path = "examples/transcription/rest/callback.rs"
required-features = ["listen"]

[[example]]
name = "make_prerecorded_request_builder"
path = "examples/transcription/rest/make_prerecorded_request_builder.rs"
required-features = ["listen"]

[[example]]
name = "prerecorded_from_url"
path = "examples/transcription/rest/prerecorded_from_url.rs"
required-features = ["listen"]

[[example]]
name = "simple_stream"
path = "examples/transcription/websocket/simple_stream.rs"
required-features = ["listen"]

[[example]]
name = "connect_diagnostics"
path = "examples/transcription/websocket/connect_diagnostics.rs"
required-features = ["connect-diagnostics"]

[[example]]
name = "callback_stream"
path = "examples/transcription/websocket/callback_stream.rs"
required-features = ["listen"]

[[example]]
name = "microphone_stream"
path = "examples/transcription/websocket/microphone_stream.rs"
required-features = ["listen"]

[[example]]
name = "16_keepalive_close_stream"
path = "examples/transcription/websocket/16_keepalive_close_stream.rs"
required-features = ["listen"]

[[example]]
name = "simple_flux"
path = "examples/transcription/flux/simple_flux.rs"
required-features = ["listen"]

[[example]]
name = "simple_flux_token"
path = "examples/transcription/flux/simple_flux_token.rs"
required-features = ["listen"]

[[example]]
name = "microphone_flux"
path = "examples/transcription/flux/microphone_flux.rs"
required-features = ["listen"]

[[example]]
name = "flux_multi_language"
path = "examples/transcription/flux/multi_language.rs"
required-features = ["listen"]

[[example]]
name = "flux_dynamic_configure"
path = "examples/transcription/flux/dynamic_configure.rs"
required-features = ["listen"]

[[example]]
name = "text_to_speech_to_file"
path = "examples/speak/rest/text_to_speech_to_file.rs"
required-features = ["speak"]

[[example]]
name = "text_to_speech_to_stream"
path = "examples/speak/rest/text_to_speech_to_stream.rs"
required-features = ["speak"]
