[package]
name = "deepgram"
version = "0.12.0"
authors = ["Deepgram <developers@deepgram.com>"]
edition = "2021"
description = "Community Rust SDK for Deepgram's automated speech recognition APIs."
license = "MIT"
repository = "https://github.com/deepgram/deepgram-rust-sdk"
keywords = [
  "transcription",
  "voice-ai",
  "text-to-speech",
  "speech-to-text",
  "asr",
]
categories = ["api-bindings", "multimedia::audio", "network-programming"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# TODO Investigate which of these dependencies can go behind features.
bytes = "1"
futures = "^0.3"
http = "1.4"
pin-project = "1"
reqwest = { version = "^0.13", default-features = false, features = [
  "json",
  "rustls",
  "stream",
  "query",
] }
serde = { version = "^1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_urlencoded = "0.7.1"
thiserror = "2"
tokio = { version = "^1.45.1", features = ["full"] }
tokio-stream = "^0.1.17"
tokio-tungstenite = { version = "^0.28.0", features = [
  "rustls-tls-webpki-roots",
], optional = true }
tokio-util = { version = "^0.7", features = ["codec", "io"] }
tungstenite = { version = "^0.28.0", optional = true }
# TLS crates for the explicit rustls connector every websocket connect path
# uses (see src/tls.rs). Versions must stay in lockstep with what
# tokio-tungstenite's rustls-tls-webpki-roots feature resolves to, so both
# crates compile against the same rustls. default-features = false: these
# deps must not enable any rustls feature (provider, logging,
# prefer-post-quantum, ...) beyond what tokio-tungstenite already enables.
# The rustls floor is above tokio-tungstenite's own (0.23.0) because
# src/diagnostics.rs reads `handshake_kind()`, added later in the 0.23 line.
rustls = { version = "^0.23.27", optional = true, default-features = false }
rustls-pki-types = { version = "^1", optional = true }
tokio-rustls = { version = "^0.26", optional = true, default-features = false }
webpki-roots = { version = "^0.26", optional = true }
# Backs the `rustls-tls-native-roots` feature. Same version tokio-tungstenite
# 0.28 uses for its feature of the same name; keep them matching on bumps.
rustls-native-certs = { version = "^0.8", optional = true }
url = "2"
uuid = { version = "1", features = ["serde"] }
# Diagnostic events from the TLS trust path (src/tls.rs); no subscriber is
# installed, so the consumer's logging setup is untouched. Optional: only the
# websocket features (via `__tls`) declare it.
tracing = { version = ">=0.1.41, <0.2", optional = true }
# Dependencies below are specified only to satisfy minimal-versions.
sha256 = "^1.6.0"
anyhow = "^1.0.98"

[dev-dependencies]
cpal = "^0.16"
crossbeam = "0.8"
audio = "0.2.0"
rodio = { version = "0.20.1" }
pkg-config = { version = "0.3.30" }
rcgen = "0.13"
tokio-rustls = "0.26"

[package.metadata.docs.rs]
all-features = true

[features]
default = ["manage", "listen", "speak"]
manage = []
listen = ["dep:tungstenite", "dep:tokio-tungstenite", "__tls"]
speak = ["dep:tungstenite", "dep:tokio-tungstenite", "__tls"]
# Also trust the operating system's certificate store, on top of the bundled
# webpki roots, for every wss:// websocket connection. For TLS-inspecting proxies
# (Zscaler, Netskope, ...), internal CAs, and self-hosted deployments. Named
# after the tokio-tungstenite and reqwest features it mirrors.
rustls-tls-native-roots = [
  "tokio-tungstenite?/rustls-tls-native-roots",
  "dep:rustls-native-certs",
]
connect-diagnostics = ["listen", "uuid/v4"]
# Internal: the rustls stack shared by every websocket surface. Not a public
# feature; enabled through `listen` and `speak`.
__tls = [
  "dep:rustls",
  "dep:rustls-pki-types",
  "dep:tokio-rustls",
  "dep:webpki-roots",
  "dep:tracing",
]

