version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Security updates only. Version updates would bump crates the SDK
    # re-exports (tungstenite, rustls, reqwest) under a `chore(deps)` title
    # that Release Please never releases.
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore(deps)
