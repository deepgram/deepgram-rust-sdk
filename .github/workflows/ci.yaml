on: [push, pull_request]

name: CI
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings
  PKG_CONFIG_PATH: /usr/lib/pkgconfig

jobs:
  Lockfile:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    # Resolves the dependency graph without compiling, so this is the cheapest
    # possible guard. `--locked` fails if Cargo.lock does not already match
    # Cargo.toml, which is what keeps a drifted lock from reaching the release
    # workflow, where it surfaces as an opaque `cargo package` dirty-tree error.
    - name: Verify Cargo.lock is up to date
      run: cargo metadata --locked --format-version 1 > /dev/null
  Features:
    runs-on: ubuntu-latest
    steps:
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        components: rustfmt
    - uses: actions/checkout@v5
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y alsa pkg-config libasound2-dev
        export PKG_CONFIG_PATH=/usr/lib/pkgconfig:$PKG_CONFIG_PATH
    - name: Check no features
      run: cargo check --all-targets --no-default-features
    - name: Check reqwest-rustls with read
      run: |
        cargo check --all-targets --no-default-features --features=read,reqwest-rustls
        cargo test --lib --no-default-features --features=read,reqwest-rustls test_deepgram_new_with_api_key
    - name: Check reqwest-no-provider feature
      run: |
        cargo check --all-targets --no-default-features --features=reqwest-no-provider
        test -z "$(cargo tree --no-default-features --features=reqwest-no-provider --edges normal,build -i aws-lc-rs)"
        cargo test --lib --no-default-features --features=reqwest-no-provider,__test-aws-lc-rs reqwest_no_provider_uses_an_installed_provider
    - name: Check listen feature
      run: cargo check --all-targets --no-default-features --features=listen
    - name: Check speak feature
      run: cargo check --all-targets --no-default-features --features=speak
    - name: Check manage feature
      run: cargo check --all-targets --no-default-features --features=manage
    - name: Check read feature
      run: cargo check --all-targets --no-default-features --features=read
    - name: Check agent feature
      run: cargo check --all-targets --no-default-features --features=agent
    - name: Check connect-diagnostics feature
      run: cargo check --all-targets --no-default-features --features=connect-diagnostics
    - name: Check rustls-tls-native-roots with listen
      run: cargo check --all-targets --no-default-features --features=listen,rustls-tls-native-roots
    - name: Check rustls-tls-native-roots with speak
      run: cargo check --all-targets --no-default-features --features=speak,rustls-tls-native-roots
    - name: Check rustls-tls-native-roots with agent
      run: cargo check --all-targets --no-default-features --features=agent,rustls-tls-native-roots
    - name: Check rustls-tls-native-roots with connect-diagnostics
      run: cargo check --all-targets --no-default-features --features=connect-diagnostics,rustls-tls-native-roots
    - name: Test default features (webpki-only trust path)
      run: cargo test --tests
  Build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y alsa pkg-config libasound2-dev
        export PKG_CONFIG_PATH=/usr/lib/pkgconfig:$PKG_CONFIG_PATH
    - name: Cargo Build
      run: cargo build --all-targets --all-features
  Clippy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        components: rustfmt
    - uses: actions/checkout@v5
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y alsa pkg-config libasound2-dev
        export PKG_CONFIG_PATH=/usr/lib/pkgconfig:$PKG_CONFIG_PATH
    - name: Cargo Clippy
      run: cargo clippy --all-targets --all-features
  Test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
    - uses: actions/checkout@v5
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y alsa pkg-config libasound2-dev
        export PKG_CONFIG_PATH=/usr/lib/pkgconfig:$PKG_CONFIG_PATH
    - name: Cargo Test
      run: cargo test --all --all-features
  Coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Branch coverage requires nightly (-Z coverage-options=branch); don't let
      # nightly lint churn fail the coverage report. Stable jobs enforce warnings.
      RUSTFLAGS: ''
      RUSTDOCFLAGS: ''
    steps:
    - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      with:
        toolchain: nightly
        components: llvm-tools-preview
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y alsa pkg-config libasound2-dev
        export PKG_CONFIG_PATH=/usr/lib/pkgconfig:$PKG_CONFIG_PATH
    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@32e16a23c68a001a1621efca19f131f965d4d122 # cargo-llvm-cov
    - name: Cargo Test with line and branch coverage
      run: cargo llvm-cov --all --all-features --branch --cobertura --output-path cobertura.xml
    - name: Generate code coverage summary
      run: |
        python3 - <<'PY' > code-coverage-results.md
        import xml.etree.ElementTree as ET

        coverage = ET.parse("cobertura.xml").getroot()

        def rate(name):
            return f"{float(coverage.attrib.get(name, 0)):.0%}"

        def count(name):
            return coverage.attrib.get(name, "0")

        print("## Code Coverage")
        print()
        print("| Metric | Coverage |")
        print("| --- | --- |")
        print(
            f"| Lines | {rate('line-rate')} "
            f"({count('lines-covered')} / {count('lines-valid')}) |"
        )
        print(
            f"| Branches | {rate('branch-rate')} "
            f"({count('branches-covered')} / {count('branches-valid')}) |"
        )
        PY
    - name: Write coverage to job summary
      if: always()
      run: cat code-coverage-results.md >> "$GITHUB_STEP_SUMMARY"
    - name: Upload coverage summary
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: coverage-summary
        path: code-coverage-results.md
        if-no-files-found: error
  Coverage-Report:
    if: >-
      github.event_name == 'pull_request' &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: Coverage
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    steps:
    - name: Download coverage summary
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: coverage-summary
        path: .
    - name: Add coverage PR comment
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
      with:
        script: |
          const fs = require('node:fs');
          const marker = '<!-- Sticky Pull Request Commentcode-coverage -->';
          const body = `${fs.readFileSync('code-coverage-results.md', 'utf8').trimEnd()}\n\n${marker}`;
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;
          const comments = await github.paginate(github.rest.issues.listComments, {
            owner,
            repo,
            issue_number,
            per_page: 100,
          });
          const existing = comments.find(
            (comment) =>
              comment.user.login === 'github-actions[bot]' &&
              comment.body.endsWith(marker),
          );

          if (existing) {
            await github.rest.issues.updateComment({
              owner,
              repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body,
            });
          }
  Format:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Cargo Fmt
      run: cargo fmt --check --all
  Documentation:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y alsa pkg-config libasound2-dev
        export PKG_CONFIG_PATH=/usr/lib/pkgconfig:$PKG_CONFIG_PATH
    - name: Cargo Doc
      run: cargo doc --workspace --all-features
    - name: Cargo Doc, each feature alone
      run: |
        for feature in listen speak manage read agent connect-diagnostics; do
          cargo doc --no-deps --no-default-features --features "$feature"
        done
  Audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Install dependencies
      run: sudo apt-get update
    - name: Install cargo-audit
      run: cargo install --locked cargo-audit
    - name: Remove Dev Dependencies
      run: |
        cargo install --locked cargo-hack
        cargo hack --remove-dev-deps
        cargo generate-lockfile
    - name: Cargo Audit
      run: cargo audit
  Minimal-Versions:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y alsa pkg-config libasound2-dev
        export PKG_CONFIG_PATH=/usr/lib/pkgconfig:$PKG_CONFIG_PATH
    - name: Install Rust Nightly
      run: rustup toolchain install nightly
    - name: Cargo Build
      run: rustup run nightly cargo build --all-targets --all-features -Z minimal-versions
    - name: Cargo Test
      run: rustup run nightly cargo test --all --all-features -Z minimal-versions
    - name: Remove Dev Dependencies
      run: |
        cargo install --locked cargo-hack
        cargo hack --remove-dev-deps
        rustup run nightly cargo generate-lockfile -Z minimal-versions
    - name: Cargo Build Without Dev Dependencies
      run: rustup run nightly cargo build --all-features -Z minimal-versions
