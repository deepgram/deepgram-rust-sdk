schema_version: 1
status: in_progress
last_verified: 2026-11-23

# This ledger defines the bounded comparison set for Rust SDK parity. Refresh
# these revisions together before changing a parity status.
#
# Status values:
#   not_started                   no work has begun on the workstream.
#   pending                       the audit is planned but has not run.
#   pending_prs_cover_*           open pull requests cover the named gap.
#   pending_product_contract      blocked on a product decision.
#   blocked_by_browser_auth_contract  blocked on a browser authentication contract.
#   decision_recorded             the decision is made and documented.
# evidence: optional repo-relative path to the document that records the decision.
sources:
  api_spec:
    repository: deepgram/deepgram-docs
    revision: 7e57d78076494e50a901315f806379319f20572c
    openapi: api/specs/openapi/openapi.yml
    asyncapi: api/specs/asyncapi/asyncapi.yml
  generated_sdks:
    javascript:
      repository: deepgram/deepgram-js-sdk
      revision: ece7c1914fbb120fdaf488e5ee3a8cd1b74e2179
    python:
      repository: deepgram/deepgram-python-sdk
      revision: 7bb602334316f6fa5ee02a4771ca77dc0e96514a
    java:
      repository: deepgram/deepgram-java-sdk
      revision: 368eb9dd5a08d7f9de74e741ee49dc40e9f06fb2
  rust_baseline:
    revision: d4e00b06130ea934fdccc23d6c49fa7c73b8db44
    release: 0.15.0

refresh:
  command: >-
    python3 scripts/refresh_parity_inventory.py --docs-dir
    /path/to/deepgram-docs --check
  behavior: The docs checkout must be at sources.api_spec.revision. Use --write
    only after reviewing and updating the source pin and snapshots together.

inventories:
  openapi:
    operation_count: 50
    snapshot: parity/openapi-operations.json
    audit_ledger: parity/operation-audit-ledger.json
    audit_row_count: 50
    route_coverage_status: refreshed_pending_row_audit
    field_and_option_audit_status: pending
  asyncapi:
    operation_count: 84
    snapshot: parity/asyncapi-operations.json
    audit_ledger: parity/operation-audit-ledger.json
    audit_row_count: 84
    protocol_message_coverage_status: refreshed_pending_row_audit
    field_and_behavior_audit_status: pending

workstreams:
  rest_schema_and_option_sweep:
    status: pending
    scope:
      - Listen and transcription request/response schema.
      - Text Intelligence and batch response schema.
      - Aura and Flux TTS request, response, and control schema.
      - Management and auth query, pagination, nullable-field, and error schema.
  voice_agent_schema_sweep:
    status: pending
    scope:
      - Settings, history, audio, listen, think, Think Live, speak, functions, and custom endpoints.
      - Every client control, server event, enum, default, and unknown-value path.
  runtime_capability_parity:
    status: decision_recorded
    evidence: docs/streaming-runtime-transport-parity.md
    scope:
      - Reconnection semantics.
      - Custom transport or transport-factory equivalent.
      - Close, retry, callback ordering, and backpressure behavior.
      - Custom endpoint and base-URL behavior.
    generated_sdk_evidence:
      javascript:
        - src/CustomClient.ts
        - src/transport.ts
      python:
        - src/deepgram/client.py
        - src/deepgram/transport_interface.py
        - src/deepgram/transports/
      java:
        - src/main/java/com/deepgram/core/ReconnectingWebSocketListener.java
        - src/main/java/com/deepgram/core/transport/
    rust_starting_point:
      - src/agent/websocket.rs
      - src/listen/websocket.rs
      - src/listen/flux.rs
      - src/speak/websocket.rs
      - src/speak/flux/websocket.rs
  developer_experience_parity:
    status: pending
    scope:
      - Listen WebSocket documentation and example coverage (issue 91).
      - Named redaction selectors (issue 87).
      - Runnable Think Live and custom Think-provider examples.
      - README, crate docs, skills, and feature-specific builds.
  automated_parity_guard:
    status: pending
    scope:
      - CI comparison of the pinned spec inventories and this ledger.
      - Local wire fixtures for typed streaming frames.
      - Live checks for claims that cannot be proven locally.

decisions_required:
  - capability: Voice Agent reconnect
    status: pending_product_contract
    reason: Reconnection can lose conversational state; the desired recovery
      semantics are not defined by the API specification.
  - capability: Browser and WASM support
    status: blocked_by_browser_auth_contract
    issue: 174
    reason: Browser WebSockets cannot use the native Authorization-header model.

claim:
  current: The operation inventories are pinned to Rust 0.15.0 and current
    sibling SDK snapshots. Row-level schema and behavior audits are pending.
  final: Rust has full documented API parity with the recorded JavaScript,
    Python, and Java SDK revisions only when every workstream is complete.
